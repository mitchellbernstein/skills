schema_version: 1
repository: mitchellbernstein/skills

# Compatibility is an installation filter, not a security boundary.
harnesses:
  codex:
    path: codex
    skill_directory: ~/.codex/skills
  claude:
    path: claude
    skill_directory: ~/.claude/skills
  cursor:
    path: cursor
    skill_directory: ~/.cursor/skills
  grok-build:
    path: grok-build
    skill_directory: platform-managed
  shared:
    path: shared
    description: Skills intended to work across harnesses; verify each SKILL.md.

skills:
  - id: delegate-to-agent
    path: shared/delegate-to-agent
    canonical_path: shared/delegate-to-agent
    copies:
      codex: codex/delegate-to-agent
      claude: claude/delegate-to-agent
      cursor: cursor/delegate-to-agent
      grok-build: grok-build/delegate-to-agent
    harnesses: [codex, claude, cursor, grok-build]
    targets: [pi, codex, claude, grok-build]
    default_models:
      pi: deepseek-v4-flash
      codex: gpt-5.6-sol
      claude: sonnet
      grok-build: grok-4.5
    requires:
      - one selected native CLI (Pi, Codex, Claude Code, or Grok Build)
      - authentication configured by that native CLI
      - Node.js/npm only when the runner bootstraps missing Pi
    bootstraps_pi_only: true
    mutates_workspace: true
    mutates_user_environment: true

  - id: delegate-to-pi
    path: shared/delegate-to-pi
    canonical_path: shared/delegate-to-pi
    copies:
      codex: codex/delegate-to-pi
      claude: claude/delegate-to-pi
      cursor: cursor/delegate-to-pi
      grok-build: grok-build/delegate-to-pi
    harnesses: [codex, claude, cursor, grok-build]
    requires:
      - pi-coding-agent
      - Node.js/npm for automatic first-run install
      - DEEPSEEK_API_KEY or Pi DeepSeek auth entry
    default_model: deepseek-v4-flash
    mutates_workspace: true
    bootstraps_local_pi: true
    mutates_user_environment: true

  - id: setup-xai-twilio-cloudflare-sip
    path: shared/setup-xai-twilio-cloudflare-sip
    canonical_path: shared/setup-xai-twilio-cloudflare-sip
    copies:
      codex: codex/setup-xai-twilio-cloudflare-sip
      claude: claude/setup-xai-twilio-cloudflare-sip
      cursor: cursor/setup-xai-twilio-cloudflare-sip
      grok-build: grok-build/setup-xai-twilio-cloudflare-sip
    harnesses: [codex, claude, cursor, grok-build]
    requires:
      - xAI account or API access
      - Twilio Elastic SIP Trunking
    mutates_workspace: false

  - id: audit-email-deliverability
    path: shared/audit-email-deliverability
    canonical_path: shared/audit-email-deliverability
    copies:
      codex: codex/audit-email-deliverability
      claude: claude/audit-email-deliverability
      cursor: cursor/audit-email-deliverability
      grok-build: grok-build/audit-email-deliverability
    harnesses: [codex, claude, cursor, grok-build]
    requires:
      - dig or an equivalent DNS query tool
      - DNS zone access (provider API token, MCP server, or dashboard login)
      - a browser-automation MCP when driving a DNS dashboard by computer use
    mutates_workspace: false
    mutates_user_environment: false
    mutates_external_state: true

  - id: record-browser-proof
    path: shared/record-browser-proof
    canonical_path: shared/record-browser-proof
    copies:
      codex: codex/record-browser-proof
      claude: claude/record-browser-proof
      cursor: cursor/record-browser-proof
      grok-build: grok-build/record-browser-proof
    harnesses: [codex, claude, cursor, grok-build]
    requires:
      - ffprobe
      - python3
      - Git
      - shasum or sha256sum
    runtime_recorders:
      - host browser automation with local WebM recording
      - agent-browser, installed only with user authorization
    recorder_setup_requires_user_authorization: true
    mutates_workspace: true
    records_browser_video: true
    requires_non_video_assertions: true
